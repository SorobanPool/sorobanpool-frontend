name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck   # next typegen first: LayoutProps and friends are generated types
      - run: pnpm test        # components, i18n completeness, pricing parity, signing guard, axe
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_DEPLOYMENTS: '{"usdc":"CAAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQC526","contracts":{}}'
      - name: JS size budget on public pages (Lighthouse, mobile emulation)
        run: |
          pnpm exec next start -p 3010 &
          npx --yes wait-on http://localhost:3010/offline
          CHROME_PATH="$(which google-chrome)" node scripts/lighthouse-budget.mjs http://localhost:3010 /:170 /onboarding:400 /offline:170
