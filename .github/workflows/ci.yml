name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck   # next typegen first: LayoutProps and friends are generated types
      - run: pnpm test        # components, i18n completeness, pricing parity, signing guard, axe
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_DEPLOYMENTS: '{"usdc":"CAAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQC526","contracts":{}}'
          ANALYZE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Upload bundle analysis report
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analysis
          path: .next/analyze
          retention-days: 14
      - name: JS size budget on public pages (Lighthouse, mobile emulation)
        run: |
          pnpm exec next start -p 3010 &
          npx --yes wait-on http://localhost:3010/offline
          CHROME_PATH="$(which google-chrome)" node scripts/lighthouse-budget.mjs http://localhost:3010 /:170 /onboarding:400 /offline:170
